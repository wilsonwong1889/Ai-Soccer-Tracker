[project]
name = "soccer-recorder"
version = "0.1.0"
description = "AI Soccer Recorder: player-focused tracking and highlights from stationary iPhone footage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
]

[project.scripts]
soccer-recorder = "soccer_recorder.cli:main"

[project.optional-dependencies]
detect = [
    "rfdetr>=1.11,<2",
    "trackers>=2.6,<3",
    "pillow>=10.1",
]
# Fine-tuning the detector on your own labelled footage (docs/training.md).
train = [
    "soccer-recorder[detect]",
    "rfdetr[train]>=1.11,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
